<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lunas amarillas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Jost:wght@300;400&display=swap">
<style>
/* Dirección: sala a oscuras. Negro profundo, marfil envejecido y un solo dorado (el de los faroles).
   Palabras en cursiva serif; interfaz en sans diminuta que casi no existe. */
:root {
  --bg: #000;
  --ink: #f4ead0;
  --ink-dim: rgba(244, 234, 208, .5);
  --gold: #e2b252;
  --fade: 2600ms;
  --grain: .16;
  --serif: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --sans: 'Jost', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
body { font-family: var(--sans); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
#root { position: fixed; inset: 0; background: #000; }
#root.idle { cursor: none; }
#stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; isolation: isolate; background: #000; }
.scene { position: absolute; inset: 0; opacity: 0; filter: blur(7px) brightness(.55); pointer-events: none; will-change: opacity;
  transition: opacity var(--fade) ease-in-out, filter var(--fade) ease-in-out; }
.scene.on { opacity: 1; filter: none; }
.cut .scene { transition-duration: 0s !important; }
.scene canvas, .scene .media { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scene .media { object-fit: cover; opacity: 0; transition: opacity 1.4s ease; mix-blend-mode: var(--mb, normal); }
.scene.has-media .media { opacity: var(--mo, 1); }
.scene.replace canvas { visibility: hidden; }
.word { position: absolute; left: 0; right: 0; top: 44%; transform: translateY(-50%); text-align: center; font-family: var(--serif); font-style: italic; font-weight: 500;
  font-size: calc(var(--u, 12px) * 9); letter-spacing: .05em; color: var(--ink); opacity: 0; filter: blur(6px);
  text-shadow: 0 0 calc(var(--u, 12px) * 3) rgba(226, 178, 82, .45), 0 2px 18px rgba(0, 0, 0, .8);
  transition: opacity 2.4s ease, filter 2.4s ease, letter-spacing 7s ease; }
.word.low { top: auto; bottom: 12%; transform: none; }
.word.show { opacity: .92; filter: none; letter-spacing: .12em; }
#vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 52%, rgba(0, 0, 0, .55) 100%); }
#flick { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
#grain { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: overlay; opacity: var(--grain); }
#blackout { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity var(--bo, 1.6s) ease; }
#blackout.on { opacity: 1; }

/* interfaz casi invisible: aparece al mover el ratón o tocar la pantalla */
#bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; gap: 18px;
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  opacity: 0; transition: opacity .6s ease; pointer-events: none; font-size: 12px; letter-spacing: .22em; color: var(--ink-dim); }
#root.ui #bar { opacity: 1; pointer-events: auto; }
#bar button { all: unset; cursor: pointer; padding: 6px 12px; font-family: var(--sans); font-size: 20px; line-height: 1; color: var(--ink-dim); }
#bar button:hover { color: var(--ink); }
#bar button:focus-visible { outline: 1px solid var(--gold); outline-offset: 2px; }
#dots { display: flex; gap: 3px; align-items: center; }
#dots button { padding: 8px 3px; font-size: 0; }
#dots button::before { content: ''; display: block; width: 14px; height: 2px; background: rgba(244, 234, 208, .22); transition: background .5s; }
#dots button.on::before { background: var(--gold); }
#dots button:hover::before { background: rgba(244, 234, 208, .7); }
#count { min-width: 11ch; white-space: nowrap; text-align: center; font-variant-numeric: tabular-nums; }
#cue { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(14px + env(safe-area-inset-top, 0px)); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-dim); opacity: 0; transition: opacity .4s; pointer-events: none; }
#root.rehearsal #cue { opacity: 1; }
#hint { position: fixed; left: 0; right: 0; bottom: 0; text-align: center; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(54px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  color: var(--ink-dim); font-weight: 300; font-size: 13px; letter-spacing: .12em; line-height: 2; transition: opacity 1.6s ease; pointer-events: none; }
#hint b { color: var(--ink); font-weight: 400; }
#hint .big { font-family: var(--serif); font-style: italic; font-size: 26px; letter-spacing: .04em; color: var(--ink); display: block; margin-bottom: 10px; }
#hint.off { opacity: 0; }
@media (max-width: 560px) { #hint { font-size: 11px; } #hint .big { font-size: 20px; } #dots { display: none; } }
@media (prefers-reduced-motion: reduce) { .scene { transition-duration: 1.2s; } }
</style>
</head>
<body>


<div id="root" class="idle">
  <div id="stage" aria-label="Experiencia audiovisual">
    <div id="scenes"></div>
    <div id="vig"></div>
    <div id="flick"></div>
    <canvas id="grain" width="256" height="144"></canvas>
    <div id="blackout"></div>
  </div>
  <div id="cue" aria-live="polite"></div>
  <div id="hint">
    <span class="big">Pulsa → o haz clic para comenzar</span>
    <b>→</b> avanzar &nbsp; <b>←</b> retroceder &nbsp; <b>Mayús+1…7</b> escenas 11–17 &nbsp; <b>B</b> oscuro &nbsp; <b>W</b> palabra &nbsp; <b>F</b> pantalla completa &nbsp; <b>R</b> ensayo &nbsp; <b>H</b> ayuda
  </div>
  <div id="bar">
    <button id="prev" type="button" aria-label="Escena anterior">‹</button>
    <span id="count">0 / 10</span>
    <nav id="dots" aria-label="Ir a una escena"></nav>
    <button id="next" type="button" aria-label="Escena siguiente">›</button>
  </div>
</div>

<script>
/* =====================================================================
   CONFIGURACIÓN  (todo lo que probablemente quieras tocar está aquí)
   ===================================================================== */
const CONFIG = {
  renderWidth: 1280,      // resolución interna del dibujo. 1920 para proyector potente, 960 para portátil lento
  fadeMs: 2600,           // duración del fundido entre escenas
  dipMs: 3600,            // duración total de un "dip" (fundido a negro y de vuelta)
  grain: 0.13,            // 0 = sin grano. Máximo útil ≈ 0.3
  adaptive: true,         // baja la resolución sola si el equipo no da la talla
  media: {
    dir: 'media/',        // carpeta con tus videos/imágenes (junto a index.html)
    pattern: 'scene-{nn}',// scene-01 … scene-10
    videoExt: 'mp4',      // se busca media/scene-01.mp4 …
    imageExt: 'jpg'       // y como alternativa estática media/scene-01.jpg …
  },
  /* Por escena (opcional). Campos:
     name        nombre interno (modo ensayo, tecla R)
     word        palabra suelta; aparece con la tecla W
     wordPos     'center' | 'low'
     wordAt      segundos tras entrar para que la palabra salga sola (null = manual)
     enter       'cross' (fundido encadenado) | 'dip' (a negro y de vuelta) al AVANZAR hacia esta escena
     video/image ruta propia, o false para desactivar. Si no se indica, se usa media.dir + pattern
     keepProcedural  true = mantiene el dibujo de código debajo del video (útil con mediaBlend)
     mediaBlend  'normal' | 'screen' | 'multiply' | 'overlay' | 'lighten' ...
     mediaOpacity 0–1                                                                 */
  scenes: [
    { name: 'El dolor y el circo',                 word: 'dolor',  enter: 'cross' },
    { name: 'Las lunas amarillas',                 word: '',       enter: 'cross' },
    { name: 'La casa junto al desierto',           word: '',       enter: 'cross' },
    { name: 'La madre y el agujero en el corazón', word: 'madre',  enter: 'cross' },
    { name: 'El miedo al padre',                   word: 'miedo',  enter: 'dip' },
    { name: 'La memoria que desaparece',           word: '',       enter: 'cross' },
    { name: 'La obsesión por los cubos',           word: 'cubos',  enter: 'cross' },
    { name: 'El juego de espías',                  word: '',       enter: 'cross' },
    { name: 'La pluma dorada',                     word: 'sueño',  enter: 'dip' },
    { name: 'El futuro escritor',                  word: '',       enter: 'cross' },
    /* Parte final. Las escenas con "pulsos" (beats) avanzan paso a paso con → antes de pasar a la siguiente. */
    { name: 'La bolsa de monedas',                 word: '',       enter: 'dip', dipMs: 5200 },
    { name: 'El camino hacia el bosque',           word: '',       enter: 'cross' },
    { name: 'La orquesta de las luciérnagas',      word: '',       enter: 'cross' },
    { name: 'Las tres criaturas',                  word: '',       enter: 'cross' },   // 2 pulsos: se acercan · lo elevan
    { name: 'El vuelo sobre su propia vida',       word: '',       enter: 'cross' },
    { name: 'La repetición',                       word: '',       enter: 'dip', dipMs: 7000 },  // 4 pulsos: entrega · foco · camino · suelo
    { name: 'El valor de una vida',                word: '',       enter: 'cross' }    // 2 pulsos: silencio · fundido a negro
  ]
};

/* =====================================================================
   ESCENAS (dibujo procedural). Todo se dibuja en un espacio de 1280x720.
   Cada escena: { init(S), draw(ctx, t, dt, S) }
   t  = segundos desde que la escena entró
   dt = segundos desde el cuadro anterior
   S  = estado propio de la escena (partículas, etc.)
   ===================================================================== */
const W = 1280, H = 720, TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function vnoise(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u); }
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function glow(ctx, x, y, r, c, a) {
  if (a <= 0.002 || r <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(c, a)); g.addColorStop(.35, rgba(c, a * .4)); g.addColorStop(1, rgba(c, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function vignette(ctx, strength, cx = W / 2, cy = H / 2, inner = .35) {
  const g = ctx.createRadialGradient(cx, cy, H * inner, cx, cy, W * .72);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${clamp(strength, 0, 1)})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function fillBG(ctx, stops) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  stops.forEach(([p, c]) => g.addColorStop(p, c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
const flick = (t, s = 0) => clamp(.84 + .2 * (vnoise(t * 5 + s * 13) * 2 - 1) + .08 * Math.sin(t * 2.3 + s), .3, 1.15);
function dustMake(n, seed, x0 = 0, x1 = W, y0 = 0, y1 = H) {
  const r = mulberry(seed);
  return Array.from({ length: n }, () => ({ x: lerp(x0, x1, r()), y: lerp(y0, y1, r()), z: .3 + r() * .7, ph: r() * TAU, sp: .4 + r() }));
}
function dustStep(a, t, dt, wx = 3, wy = -2) {
  for (const d of a) {
    d.x += (wx * d.z + Math.sin(t * .4 + d.ph) * 6 * d.z) * dt * d.sp;
    d.y += (wy * d.z + Math.cos(t * .3 + d.ph) * 4 * d.z) * dt * d.sp;
    if (d.x > W + 10) d.x = -10; if (d.x < -10) d.x = W + 10;
    if (d.y < -10) d.y = H + 10; if (d.y > H + 10) d.y = -10;
  }
}
/* silueta de niño (feet = y de los pies); hl/hr = posición de manos */
function kid(ctx, x, y, s, hl, hr, col = '#030201') {
  ctx.save(); ctx.strokeStyle = ctx.fillStyle = col; ctx.lineCap = ctx.lineJoin = 'round';
  const hy = y - 58 * s, sy = y - 102 * s;
  ctx.lineWidth = 11 * s; ctx.beginPath(); ctx.moveTo(x, hy); ctx.lineTo(x - 9 * s, y); ctx.moveTo(x, hy); ctx.lineTo(x + 9 * s, y); ctx.stroke();
  ctx.lineWidth = 24 * s; ctx.beginPath(); ctx.moveTo(x, hy); ctx.lineTo(x, sy); ctx.stroke();
  ctx.lineWidth = 8 * s; ctx.beginPath();
  ctx.moveTo(x - 9 * s, sy + 4); ctx.quadraticCurveTo((x - 9 * s + hl[0]) / 2 - 10 * s, (sy + hl[1]) / 2 + 14 * s, hl[0], hl[1]);
  ctx.moveTo(x + 9 * s, sy + 4); ctx.quadraticCurveTo((x + 9 * s + hr[0]) / 2 + 10 * s, (sy + hr[1]) / 2 + 14 * s, hr[0], hr[1]);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y - 122 * s, 14 * s, 0, TAU); ctx.fill(); ctx.restore();
}
/* silueta de adulto (para sombras): feet=y, h=altura total */
function adult(ctx, x, y, h, col = '#000', sway = 0) {
  const s = h / 180; ctx.save(); ctx.fillStyle = ctx.strokeStyle = col; ctx.lineCap = ctx.lineJoin = 'round';
  ctx.lineWidth = 17 * s; ctx.beginPath(); ctx.moveTo(x - 4 * s, y - 88 * s); ctx.lineTo(x - 14 * s, y); ctx.moveTo(x + 4 * s, y - 88 * s); ctx.lineTo(x + 14 * s, y); ctx.stroke();
  ctx.lineWidth = 44 * s; ctx.beginPath(); ctx.moveTo(x + sway, y - 92 * s); ctx.lineTo(x + sway, y - 144 * s); ctx.stroke();
  ctx.lineWidth = 13 * s; ctx.beginPath(); ctx.moveTo(x - 20 * s + sway, y - 144 * s); ctx.lineTo(x - 27 * s + sway, y - 84 * s); ctx.moveTo(x + 20 * s + sway, y - 144 * s); ctx.lineTo(x + 27 * s + sway, y - 84 * s); ctx.stroke();
  ctx.beginPath(); ctx.arc(x + sway, y - 166 * s, 15 * s, 0, TAU); ctx.fill(); ctx.restore();
}
function ball(ctx, x, y, r, lx, ly, lum, tint = [255, 150, 60]) {
  ctx.fillStyle = '#030201'; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  let dx = lx - x, dy = ly - y; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
  const g = ctx.createRadialGradient(x + dx * r * .5, y + dy * r * .5, 0, x + dx * r * .5, y + dy * r * .5, r * 1.25);
  g.addColorStop(0, rgba(tint, .42 * lum)); g.addColorStop(.5, rgba(tint, .08 * lum)); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.clip(); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
  ctx.strokeStyle = rgba(tint, .18 * lum); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, y, r - .8, 0, TAU); ctx.stroke();
}

const SCENES = [];

/* ---------- 1. El dolor y el circo ---------- */
SCENES.push({
  init(S) {
    S.fl = []; S.r = mulberry(11);
    S.aud = Array.from({ length: 30 }, (_, i) => ({ x: i * 45 + S.r() * 20 - 10, r: 20 + S.r() * 10, ph: S.r() * TAU, y: 690 + S.r() * 18 }));
  },
  draw(ctx, t, dt, S) {
    const hb = Math.pow(Math.max(0, Math.sin(t * 4.19)), 8);
    fillBG(ctx, [[0, '#050302'], [.6, '#0c0603'], [1, '#1a0b04']]);
    ctx.save(); ctx.translate(Math.sin(t * .9) * 4, Math.sin(t * 1.3) * 3 + hb * 2);
    const cx = 651, cy = 262;
    const tor = [0, 1, 2].map(i => { const p = t * 1.9 + i * TAU / 3; return { x: cx + 175 * Math.sin(p), y: cy - 82 * Math.cos(p) + 12 * Math.sin(p * 2), rot: p * 2.2 }; });
    const lx = (tor[0].x + tor[1].x + tor[2].x) / 3, ly = (tor[0].y + tor[1].y + tor[2].y) / 3;
    // cono de luz
    const cg = ctx.createLinearGradient(0, 0, 0, H); cg.addColorStop(0, 'rgba(255,170,70,.10)'); cg.addColorStop(1, 'rgba(255,140,40,0)');
    ctx.fillStyle = cg; ctx.beginPath(); ctx.moveTo(620, -20); ctx.lineTo(680, -20); ctx.lineTo(900, 700); ctx.lineTo(400, 700); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    tor.forEach((p, i) => glow(ctx, p.x, p.y, 340, [255, 120, 30], .2 * flick(t, i) * (1 + hb * .25)));
    glow(ctx, 651, 470, 380, [200, 80, 20], .08);
    ctx.globalCompositeOperation = 'source-over';
    // esferas
    [[500, 598, 42], [802, 600, 40], [885, 626, 15]].forEach(b => ball(ctx, b[0], b[1], b[2], lx, ly, .8));
    ball(ctx, 590, 580, 60, lx, ly, 1); ball(ctx, 712, 580, 60, lx, ly, 1); ball(ctx, 651, 478, 56, lx, ly, 1);
    // niño
    const sway = Math.sin(t * 1.3) * 3;
    kid(ctx, 651 + sway, 424, 1, [612 + Math.sin(t * 1.9) * 12, 330 - Math.abs(Math.sin(t * 1.9)) * 24], [690 + Math.cos(t * 1.9) * 12, 330 - Math.abs(Math.cos(t * 1.9)) * 24]);
    // antorchas + llamas
    tor.forEach(p => {
      const hx = p.x + Math.sin(p.rot) * 24, hy = p.y - Math.cos(p.rot) * 24;
      ctx.strokeStyle = '#2a1608'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(p.x - Math.sin(p.rot) * 20, p.y + Math.cos(p.rot) * 20); ctx.lineTo(hx, hy); ctx.stroke();
      for (let k = 0; k < 3; k++) S.fl.push({ x: hx + (S.r() - .5) * 6, y: hy, vx: (S.r() - .5) * 40 + 12, vy: -50 - S.r() * 70, life: .7, max: .7, sz: 16 + S.r() * 10 });
    });
    ctx.globalCompositeOperation = 'lighter';
    for (let i = S.fl.length - 1; i >= 0; i--) {
      const f = S.fl[i]; f.life -= dt; if (f.life <= 0) { S.fl.splice(i, 1); continue; }
      f.x += f.vx * dt; f.y += f.vy * dt; f.vx += (S.r() - .5) * 90 * dt;
      const k = f.life / f.max;
      glow(ctx, f.x, f.y, f.sz * (.5 + k), [255, 90 + 150 * k * k, 20 + 60 * k * k * k], .42 * k);
    }
    if (S.fl.length > 420) S.fl.splice(0, S.fl.length - 420);
    // criatura en el estómago
    for (let k = 0; k < 4; k++) glow(ctx, 651 + Math.sin(t * .7 + k * 2) * 16 + sway, 348 + Math.cos(t * .9 + k) * 10, 46 + k * 20 + hb * 26, [170, 30, 6], .07 + hb * .07);
    // destello de aplauso/explosión
    const ph = t % 12; if (ph < .35) glow(ctx, 651, 330, 900, [255, 170, 90], .1 * (1 - ph / .35));
    ctx.globalCompositeOperation = 'source-over';
    // público
    const ap = .5 + .5 * Math.sin(t * .45);
    S.aud.forEach(a => {
      const bob = Math.sin(t * 9 + a.ph) * 2.5 * ap, y = a.y + bob;
      ctx.fillStyle = '#020101'; ctx.beginPath(); ctx.arc(a.x, y - 22, a.r * .75, 0, TAU); ctx.fill();
      ctx.beginPath(); ctx.ellipse(a.x, y + 20, a.r * 1.7, a.r * 1.5, 0, Math.PI, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,140,50,.18)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(a.x, y - 22, a.r * .75, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    });
    ctx.restore();
    vignette(ctx, .78 + hb * .12, 651, 330, .28 - hb * .05);
  }
});

/* ---------- 2. Las lunas amarillas ---------- */
SCENES.push({
  init(S) {
    const r = mulberry(21);
    S.lan = Array.from({ length: 11 }, (_, i) => ({ ax: 70 + i * 114 + r() * 40 - 20, len: 110 + r() * 300, d: r(), ph: r() * TAU, w: .5 + r() * .4, amp: .035 + r() * .03 }));
    S.lan.sort((a, b) => a.d - b.d);
    S.dust = dustMake(90, 5);
  },
  draw(ctx, t, dt, S) {
    fillBG(ctx, [[0, '#04050a'], [.55, '#0a0a10'], [1, '#07060a']]);
    // paños de la carpa
    const N = 16, ax = 640, ay = -150;
    for (let i = 0; i < N; i++) {
      const x0 = -200 + i * (W + 400) / N, x1 = -200 + (i + 1) * (W + 400) / N;
      ctx.fillStyle = i % 2 ? '#0d0b10' : '#0a090d'; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(x0, 470); ctx.lineTo(x1, 470); ctx.fill();
      ctx.strokeStyle = 'rgba(80,70,60,.25)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(x0, 470); ctx.stroke();
    }
    ctx.fillStyle = '#08070b'; ctx.fillRect(0, 470, W, 110);
    ctx.strokeStyle = 'rgba(90,75,55,.22)'; ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.moveTo(0, 470 + i * 3); ctx.lineTo(W, 470 + i * 3); ctx.stroke(); }
    // pista
    fillBG2(ctx, 560, H, '#0a0807', '#050404');

    ctx.lineWidth = 15; ctx.beginPath(); ctx.moveTo(hx - 24, hy - 10); ctx.quadraticCurveTo(hx - 40, hy - 38, hx - 6, hy - 40); ctx.stroke();
    const rg = ctx.createRadialGradient(hx - 14, hy - 10, 4, hx, hy, 70); rg.addColorStop(0, 'rgba(215,215,235,.26)'); rg.addColorStop(1, 'rgba(215,215,235,0)'); ctx.fillStyle = rg; ctx.beginPath(); ctx.ellipse(hx, hy, 44, 30, .15, 0, TAU); ctx.fill();
    ctx.restore();
    if (bt > 13.8 && bt < 17.5) { for (let i = 0; i < 7; i++) { const a = smooth(13.8, 14.2, bt) * (1 - smooth(14.2, 17.5, bt)); ctx.fillStyle = `rgba(150,140,125,${.28 * a})`; ctx.beginPath(); ctx.arc(hx - 50 + i * 16 + Math.sin(i * 5) * 8, hy + 24 - (bt - 13.8) * 5 - i * 2, 7 + i, 0, TAU); ctx.fill(); } }
  }
  // un brillo lejano que se aleja: la bolsa
  if (bt > 24) { const g = (1 - smooth(26, 66, bt)) * (.55 + .45 * Math.sin(bt * 1.7)); ctx.globalCompositeOperation = 'lighter'; glow(ctx, 1180 + (bt - 24) * 1.5, 366, 20, [255, 215, 140], .45 * g); ctx.globalCompositeOperation = 'source-over'; }
  // neblina baja
  for (let k = 0; k < 3; k++) { const fyy = 330 + k * 38, off = Math.sin(t * .05 * calm + k) * 20 * calm, fg = ctx.createLinearGradient(0, fyy - 36, 0, fyy + 30); fg.addColorStop(0, 'rgba(120,130,170,0)'); fg.addColorStop(.55, 'rgba(120,130,170,.09)'); fg.addColorStop(1, 'rgba(120,130,170,0)'); ctx.fillStyle = fg; ctx.fillRect(off - 20, fyy - 36, W + 40, 66); }
  // luciérnagas muy débiles al fondo (solo en la escena 17)
  if (o.fire > .01) {
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 9; i++) { const bx = 120 + hash(i * 11) * 1040 + Math.sin(t * .1 + i) * 14 * calm, by = 238 + hash(i * 5) * 78 + Math.cos(t * .13 + i * 2) * 6 * calm, a = Math.pow(Math.max(0, Math.sin(t * (.18 + hash(i) * .15) + i * 2.3)), 4) * o.fire; if (a > .02) { glow(ctx, bx, by, 10, [185, 205, 165], .26 * a); ctx.fillStyle = rgba([215, 225, 190], .4 * a); ctx.fillRect(bx - 1, by - 1, 2, 2); } }
    ctx.globalCompositeOperation = 'source-over';
  }
  vignette(ctx, .9, 700, 420, .25);
  const bg = ctx.createRadialGradient(1280, 720, 40, 1280, 720, 500); bg.addColorStop(0, 'rgba(0,0,0,.35)'); bg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
}

/* =====================================================================
   ESCENA 16 · LA REPETICIÓN
   Pulso 0: la entrega, idéntica a la escena 11.
   Pulso 1: el foco pasa a la figura tras el vidrio; la luz pierde calidez.
   Pulso 2: el camino; alguien lo sigue.
   Pulso 3: el suelo; sombras; la bolsa cae; la mano queda inmóvil.
   ===================================================================== */
SCENES.push({
  beats: 4,
  init(S) { pawnInit(S); roadInit(S); pathInit(S); S.lb = -1; S.st = [0, 0, 0, 0]; S.pv = -1; S.tc = -99; S.f = 0; S.cool = 0; S.fig = 0; S.grip = 0; },
  draw(ctx, t, dt, S) {
    const b = S.beat | 0, vw = k => k < 2 ? 0 : (k === 2 ? 1 : 2);
    if (b !== S.lb) { if (S.lb >= 0 && vw(S.lb) !== vw(b)) { S.pv = vw(S.lb); S.tc = t; } S.lb = b; S.st[b] = t; }
    const tg = b >= 1 ? 1 : 0;
    S.f += clamp(tg - S.f, -dt / 5.5, dt / 5.5); S.cool += clamp(tg - S.cool, -dt / 14, dt / 14); S.fig += clamp(tg - S.fig, -dt / 3.5, dt / 3.5); S.grip += clamp(tg - S.grip, -dt / 4, dt / 4);
    const view = vw(b), k = clamp((t - S.tc) / 3.2, 0, 1);
    const drawView = v => { if (v === 0) pawn(ctx, t, S, { f: smooth(0, 1, S.f), g: S.f * .9, cool: smooth(0, 1, S.cool), grip: S.grip, fig: smooth(0, 1, S.fig) }); else if (v === 1) roadView(ctx, t - S.st[2], S); else pathShot(ctx, t, t - S.st[3], S, { calm: 1, fire: 0 }); };
    if (S.pv >= 0 && k < 1) { drawView(S.pv); ctx.save(); ctx.globalAlpha = smooth(0, 1, k); drawView(view); ctx.restore(); }
    else { S.pv = -1; drawView(view); }
  }
});

/* =====================================================================
   ESCENA 17 · EL VALOR DE UNA VIDA
   El mismo plano, sin acción. Con el tiempo se vuelve casi inmóvil.
   Pulso 0: silencio visual. Pulso 1: fundido lento a negro (cuando tú lo decidas).
   ===================================================================== */
SCENES.push({
  beats: 2,
  init(S) { pathInit(S); S.fade = 0; },
  draw(ctx, t, dt, S) {
    const calm = lerp(1, .04, smooth(18, 80, t));
    pathShot(ctx, t, 12.9 + 17 + t, S, { calm, fire: smooth(3, 40, t) * .9 });
    const tg = S.beat >= 1 ? 1 : 0; S.fade += clamp(tg - S.fade, -dt / 12, dt / 12);
    if (S.fade > .001) { ctx.fillStyle = `rgba(0,0,0,${smooth(0, 1, S.fade)})`; ctx.fillRect(0, 0, W, H); }
  }
});


/* =====================================================================
   MOTOR
   ===================================================================== */
(() => {
  const $ = s => document.querySelector(s);
  const root = $('#root'), stage = $('#stage'), holder = $('#scenes'), blackout = $('#blackout'), grainC = $('#grain'),
    hint = $('#hint'), cue = $('#cue'), flickEl = $('#flick'), count = $('#count'), dotsEl = $('#dots');
  const N = SCENES.length, CFG = CONFIG;
  const calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let RW = CFG.renderWidth, RH = Math.round(RW * 9 / 16);
  root.style.setProperty('--fade', CFG.fadeMs + 'ms');
  root.style.setProperty('--grain', calm ? CFG.grain * .5 : CFG.grain);

  const items = SCENES.map((sc, i) => {
    const nn = String(i + 1).padStart(2, '0'), M = CFG.media, base = M.dir + M.pattern.replace('{nn}', nn);
    const meta = Object.assign({ name: 'Escena ' + (i + 1), word: '', wordPos: 'center', wordAt: null, enter: 'cross', keepProcedural: false, mediaOpacity: 1, mediaBlend: 'normal', dipMs: null }, CFG.scenes[i] || {});
    if (meta.video === undefined) meta.video = base + '.' + M.videoExt;
    if (meta.image === undefined) meta.image = base + '.' + M.imageExt;
    const el = document.createElement('section'); el.className = 'scene'; el.setAttribute('aria-label', meta.name);
    const cv = document.createElement('canvas'); cv.width = RW; cv.height = RH; el.appendChild(cv);
    const word = document.createElement('div'); word.className = 'word' + (meta.wordPos === 'low' ? ' low' : ''); word.textContent = meta.word || ''; el.appendChild(word);
    holder.appendChild(el);
    return { i, meta, beats: SCENES[i].beats || 1, beat: 0, beatT0: 0, el, cv, ctx: cv.getContext('2d', { alpha: false }), word, live: false, skip: false, S: null, t0: 0, tm: null, video: null, mediaTried: false };
  });

  /* --- imágenes / videos de reemplazo (se cargan solo cuando la escena está cerca) --- */
  function ensureMedia(i) {
    const it = items[i]; if (!it || it.mediaTried) return; it.mediaTried = true;
    const m = it.meta;
    const ok = () => {
      it.el.classList.add('has-media'); it.el.style.setProperty('--mo', m.mediaOpacity); it.el.style.setProperty('--mb', m.mediaBlend);
      if (!m.keepProcedural) { it.el.classList.add('replace'); it.skip = true; }
      if (it.video && it.live) it.video.play().catch(() => {});
    };
    if (m.image) { const im = new Image(); im.className = 'media'; im.alt = ''; im.onload = ok; im.onerror = () => im.remove(); im.src = m.image; it.el.insertBefore(im, it.word); }
    if (m.video) {
      const v = document.createElement('video'); v.className = 'media'; v.muted = true; v.defaultMuted = true; v.loop = true; v.playsInline = true; v.preload = 'auto'; v.disablePictureInPicture = true;
      v.onloadeddata = ok; v.onerror = () => { v.remove(); it.video = null; }; v.src = m.video; it.video = v; it.el.insertBefore(v, it.word);
    }
  }

  /* --- navegación --- */
  let cur = -1, black = false, wordTimer = null, dipTimer = null;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function setWord(on) { const w = cur >= 0 ? items[cur].word : null; document.querySelectorAll('.word.show').forEach(e => { if (e !== w) e.classList.remove('show'); }); if (w && w.textContent) w.classList.toggle('show', on); }
  function ui() { const it = cur >= 0 ? items[cur] : null, bt = it && it.beats > 1 ? ' ' + '•'.repeat(it.beat + 1) + '◦'.repeat(it.beats - it.beat - 1) : ''; count.textContent = (cur + 1) + ' / ' + N + bt; cue.textContent = it ? String(cur + 1).padStart(2, '0') + ' · ' + it.meta.name + (it.beats > 1 ? ' · pulso ' + (it.beat + 1) + '/' + it.beats : '') : ''; dotsEl.querySelectorAll('button').forEach((b, k) => b.classList.toggle('on', k === cur)); }
  function enterScene(n, dir) {
    const it = items[n]; clearTimeout(it.tm); it.beat = dir < 0 && it.beats > 1 ? it.beats - 1 : 0; it.beatT0 = performance.now(); it.S = {}; SCENES[n].init(it.S); it.t0 = performance.now(); it.live = true; it.el.classList.add('on');
    if (it.video) { try { it.video.currentTime = 0; } catch (e) {} it.video.play().catch(() => {}); }
    clearTimeout(wordTimer); setWord(false);
    if (it.meta.wordAt != null) wordTimer = setTimeout(() => setWord(true), it.meta.wordAt * 1000);
  }
  function retireScene(p) {
    const it = items[p]; it.el.classList.remove('on'); clearTimeout(it.tm);
    it.tm = setTimeout(() => { if (cur !== p) { it.live = false; if (it.video) it.video.pause(); } }, CFG.fadeMs + 400);
  }
  function show(n) {
    n = clamp(n, 0, N - 1); if (n === cur) return;
    if (black) setBlack(false);
    clearTimeout(dipTimer); stage.classList.remove('cut');
    const prev = cur, dir = n > prev ? 1 : -1;
    for (let k = n - 1; k <= n + 1; k++) ensureMedia(k);
    hint.classList.add('off');
    const finish = () => { cur = n; enterScene(n, dir); ui(); };
    if (prev < 0) { finish(); return; }
    if (dir > 0 && items[n].meta.enter === 'dip') {
      const dm = items[n].meta.dipMs || CFG.dipMs, half = dm * .4; blackout.style.setProperty('--bo', half + 'ms'); blackout.classList.add('on');
      dipTimer = setTimeout(() => {
        stage.classList.add('cut'); items[prev].el.classList.remove('on'); items[prev].live = false; if (items[prev].video) items[prev].video.pause();
        finish(); void stage.offsetWidth; stage.classList.remove('cut');
        blackout.style.setProperty('--bo', dm * .6 + 'ms'); blackout.classList.remove('on');
      }, half + 250);
      return;
    }
    cur = n; retireScene(prev); enterScene(n, dir); ui();
  }
  const next = () => { if (cur < 0) { show(0); return; } const it = items[cur]; if (it.beat < it.beats - 1) { it.beat++; it.beatT0 = performance.now(); ui(); } else show(cur + 1); };
  const prev = () => { if (cur < 0) return; const it = items[cur]; if (it.beat > 0) { it.beat--; it.beatT0 = performance.now(); ui(); } else if (cur > 0) show(cur - 1); };
  function setBlack(on) { black = on; blackout.style.setProperty('--bo', '1.6s'); blackout.classList.toggle('on', on); }

  /* --- bucle de dibujo --- */
  let last = performance.now(), fps = 60, lowSince = 0;
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; fps += (1 / Math.max(dt, .001) - fps) * .04;
    for (const it of items) {
      if (!it.live || it.skip) continue;
      const c = it.ctx; c.save(); c.setTransform(RW / 1280, 0, 0, RW / 1280, 0, 0); c.clearRect(0, 0, 1280, 720);
      it.S.beat = it.beat; it.S.bt = (now - it.beatT0) / 1000; try { SCENES[it.i].draw(c, (now - it.t0) / 1000, dt, it.S); } catch (e) { if (!it.err) { it.err = 1; console.error('Escena ' + (it.i + 1), e); } }
      c.restore();
    }
    if (CFG.adaptive && cur >= 0) {
      if (fps < 26) { lowSince = lowSince || now; if (now - lowSince > 3000 && RW > 700) { RW = Math.max(640, Math.round(RW * .8 / 16) * 16); RH = Math.round(RW * 9 / 16); items.forEach(it => { it.cv.width = RW; it.cv.height = RH; }); lowSince = 0; fps = 40; } } else lowSince = 0;
    }
    grain(now); requestAnimationFrame(frame);
  }
  /* grano de película, rayas y motas */
  const gctx = grainC.getContext('2d'), gi = gctx.createImageData(256, 144); let gT = 0;
  function grain(now) {
    if (now - gT < 85) return; gT = now;
    const d = gi.data; for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255 | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
    gctx.putImageData(gi, 0, 0);
    if (!calm) {
      if (Math.random() < .07) { gctx.fillStyle = 'rgba(255,255,255,.35)'; gctx.fillRect(Math.random() * 256 | 0, 0, 1, 144); }
      for (let k = 0; k < 3; k++) if (Math.random() < .18) { gctx.fillStyle = 'rgba(255,255,255,.7)'; gctx.fillRect(Math.random() * 256 | 0, Math.random() * 144 | 0, 1.6, 1.6); }
      flickEl.style.opacity = (Math.random() * .05).toFixed(3);
    }
  }

  /* --- tamaño 16:9 siempre --- */
  function fit() { const k = Math.min(innerWidth / 16, innerHeight / 9); stage.style.width = 16 * k + 'px'; stage.style.height = 9 * k + 'px'; root.style.setProperty('--u', (16 * k / 100) + 'px'); }
  addEventListener('resize', fit); fit();

  /* --- puntos de navegación --- */
  items.forEach((it, k) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', 'Escena ' + (k + 1) + ': ' + it.meta.name); b.title = (k + 1) + ' · ' + it.meta.name; b.onclick = e => { e.stopPropagation(); show(k); }; dotsEl.appendChild(b); });
  $('#prev').onclick = e => { e.stopPropagation(); prev(); }; $('#next').onclick = e => { e.stopPropagation(); next(); };

  /* --- entradas: teclado, clic, tacto, ratón --- */
  function fullscreen() { const d = document; if (d.fullscreenElement) d.exitFullscreen(); else (root.requestFullscreen || d.documentElement.requestFullscreen).call(root).catch(() => {}); }
  function toggleHelp() { hint.classList.toggle('off'); }
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'].includes(k)) { e.preventDefault(); if (!e.repeat) next(); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); if (!e.repeat) prev(); }
    else if (k === 'Home') show(0); else if (k === 'End') show(N - 1);
    else if (e.shiftKey && /^Digit[1-9]$/.test(e.code)) show(9 + +e.code.slice(5)); else if (/^[1-9]$/.test(k)) show(+k - 1); else if (k === '0') show(9);
    else if (k === 'b' || k === 'B' || k === '.') setBlack(!black);
    else if (k === 'w' || k === 'W') { if (cur >= 0) setWord(!items[cur].word.classList.contains('show')); }
    else if (k === 'f' || k === 'F') fullscreen();
    else if (k === 'r' || k === 'R') root.classList.toggle('rehearsal');
    else if (k === 'h' || k === 'H' || k === '?') toggleHelp();
  });
  root.addEventListener('click', e => { if (e.target.closest('#bar')) return; (e.clientX / innerWidth < .33) ? prev() : next(); });
  let tx = null; root.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  root.addEventListener('touchend', e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 50) { e.preventDefault(); dx < 0 ? next() : prev(); } }, { passive: false });
  let idle; function wake() { root.classList.remove('idle'); root.classList.add('ui'); clearTimeout(idle); idle = setTimeout(() => { root.classList.add('idle'); root.classList.remove('ui'); }, 2400); }
  ['mousemove', 'touchstart'].forEach(ev => root.addEventListener(ev, wake, { passive: true }));
  idle = setTimeout(() => root.classList.remove('ui'), 100);
  document.addEventListener('visibilitychange', () => { if (document.hidden) items.forEach(it => it.video && it.video.pause()); else if (cur >= 0 && items[cur].video) items[cur].video.play().catch(() => {}); });
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}

  ui(); requestAnimationFrame(frame);
  window.INMERSION = { show, next, prev, setBlack, items, get current() { return cur; } };
  const h = parseInt((location.hash || '').replace('#', ''), 10); if (h >= 1 && h <= N) show(h - 1);
})();
</script>
